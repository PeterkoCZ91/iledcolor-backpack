name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BatohManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit tests
        run: >
          ./gradlew --console=plain
          :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
          :feature:backpack:testDebugUnitTest :feature:search:testDebugUnitTest
          :feature:library:testDebugUnitTest :core:conversion:testDebugUnitTest
          :core:data:testDebugUnitTest :core:storage:testDebugUnitTest
      # CI has no local.properties, so this APK contains no API keys; users enter their own
      # Giphy / Klipy keys in Settings. Signed with the runner's throw-away debug key.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gifpack-debug-${{ github.sha }}
          path: BatohManager/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool and localisation tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
